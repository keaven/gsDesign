url: https://keaven.github.io/gsDesign/

template:
  bootstrap: 5
  bslib:
    preset: "bootstrap"
  math-rendering: "mathjax"

reference:
# Select each shared help topic once; pkgdown lists its function aliases together.
- title: Group Sequential Design
  desc: >
    Start with `vignette("gsDesignPackageOverview")`. Derive a design,
    inspect its operating characteristics, and round the design for implementation.
  contents:
  - gsDesign-package
  - gsDesign
  - plot.gsDesign
  - gsProbability
  - toInteger
- title: Design Summaries and Effect Scales
  desc: >
    Summarize boundaries, power, spending, and approximate treatment effects.
    The shared `gsBoundSummary()` topic also documents `summary()`, `gsDelta()`,
    `gsHR()`, `gsRR()`, and related boundary transformations.
  contents:
  - gsBoundSummary
  - xtable
  - as_table
  - lt
  - lt-methods
  - lt.gsVETable
  - as_rtf
  - as_gt
- title: Calibrating Spending to Interim Targets
  desc: >
    Translate CP, predictive power, probability of success, or approximate
    treatment effect targets into spending function parameters. Start with
    `vignette("CPFutilitySpending")`, `vignette("DragalinFutilitySpending")`,
    or `vignette("EffectSpending")`. For conditional probability of success,
    `gsCPOSFutilitySpending()` supports both preserve power and fixed information
    modes; `gsCAFutilitySpending()` is the fixed information compatibility wrapper.
  contents:
  - gsCPFutilitySpending
  - gsPPFutilitySpending
  - gsEffectSpending
  - gsPOSFutilitySpending
  - gsCPOSFutilitySpending
  - gsCAFutilitySpending
- title: Conditional Power and Probability of Success
  desc: >
    Calculate CP and predictive power at an observed interim result, prior
    probability of success, or conditional probability of success given
    continuation. The shared `gsCP()` topic includes `gsPP()`, `gsPOS()`,
    `gsCPOS()`, `gsPosterior()`, and `gsPI()`.
  contents:
  - gsCP
  - gsBoundCP
  - normalGrid
  - gsDensity
- title: Sample Size Adaptation
  desc: >
    Sample size re-estimation using conditional power and combination tests.
  contents:
  - ssrCP
- title: Spending Functions
  desc: >
    Standard spending families, flexible piecewise spending, and spending
    modifications. See `vignette("SpendingFunctionOverview")`; calibration
    functions for clinical interim targets are listed separately above.
  contents:
  - spendingFunction
  - sfLDOF
  - sfHSD
  - sfPower
  - sfExponential
  - sfLogistic
  - sfTDist
  - sfLinear
  - sfPoints
  - sfTruncated
  - sfXG1
- title: Normal Endpoint Design
  contents:
  - nNormal
- title: Two-Arm Binomial Endpoint Design
  contents:
  - nBinomial
  - binomialPowerTable
- title: Single-Arm Exact Binomial Design
  desc: >
    Exact binomial group sequential designs, sequential probability ratio tests,
    and fixed design sample sizes.
  contents:
  - gsBinomialExact
- title: Exact Binomial Monitoring and Vaccine/Prevention Efficacy
  desc: >
    Transform survival designs to exact binomial monitoring, evaluate conditional
    power and sequential inference, and simulate seasonal rare-event trials.
  contents:
  - toBinomialExact
  - VEtable
  - ciBinomialExact
  - repeatedCIBinomialExact
  - sequentialCIBinomialExact
  - gsCPBinomialExact
  - repeatedPValueBinomialExact
  - sequentialPValueBinomialExact
  - simBinomialSeasonalExact
- title: Time-to-Event Design and Power
  desc: >
    Use `gsSurv()` for information-driven designs, `gsSurvCalendar()` for
    calendar time looks, and `gsSurvPower()` for power under a fixed plan.
    The shared `gsSurv()` topic includes `nSurv()`, `nEventsIA()`, and `tEventsIA()`.
    The earlier, more limited Lachin-Foulkes implementation and additional
    event count and hazard ratio conversions are documented in `nSurvival()`.
  contents:
  - gsSurv
  - gsSurvCalendar
  - gsSurvPower
  - nSurvival
- title: Survival Event Counts and Follow-Up
  contents:
  - eEvents
  - medianFollowUp
  - plotMinMedianFollowUp
- title: Low-Level Boundary Computation and Input Checking
  contents:
  - gsBound
  - sequentialPValue
  - checkLengths

articles:
  - title: "General information"
    navbar: "Getting started"
    desc: >
      Introductory and broad overview materials.
    contents:
      - GentleIntroductionToGSD
      - gsDesignPackageOverview
      - gsDesignHistory
      - SpendingFunctionOverview
      - nNormal
      - binomialTwoSample
  - title: "Designing for time-to-event endpoints"
    navbar: "Time-to-event designs"
    desc: >
      These vignettes provide an introduction to designing group sequential trials with
      time-to-event endpoints using gsDesign.
    contents:
      - SurvivalOverview
      - gsSurvBasicExamples
      - SurvivalEnrollmentPlanning
      - SelectiveBoundTesting
      - toInteger
      - gsSurvPower
      - HarmBound
      - PoissonMixtureModel
      - SeqDesignSurvival
  - title: "Exact binomial designs with spending"
    navbar: "Exact binomial designs"
    desc: >
      Exact binomial workflows, including designs based on spending functions.
    contents:
      - VaccineEfficacy
      - MultiSeasonRareEvents
      - binomialSPRTExample
  - title: "Multiple hypothesis testing"
    navbar: "Multiple testing"
    desc: >
      Graphical and related multiple testing workflows.
    contents:
      - hGraph
      - GraphicalMultiplicity
  - title: "Conditional power and adaptation"
    navbar: "Interim targets and adaptation"
    desc: >
      Interim decision support and adaptation-oriented examples.
    contents:
      - ConditionalPowerPlot
      - CPFutilitySpending
      - DragalinFutilitySpending
      - EffectSpending
      - ConditionalErrorSpending
